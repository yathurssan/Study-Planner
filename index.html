<script>
/* Icons + manifest generated at runtime so the app stays a single file */
(function(){
  function icon(size){
    var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#3b4fd8');g.addColorStop(1,'#0fb5a3');
    x.fillStyle=g;x.fillRect(0,0,size,size);
    var s=size/100;x.strokeStyle='#fff';x.lineWidth=7*s;x.lineCap='round';x.lineJoin='round';
    var l=22*s,t=27*s,w=56*s,h=52*s,r=9*s;
    x.beginPath();x.moveTo(l+r,t);x.lineTo(l+w-r,t);x.arcTo(l+w,t,l+w,t+r,r);x.lineTo(l+w,t+h-r);x.arcTo(l+w,t+h,l+w-r,t+h,r);
    x.lineTo(l+r,t+h);x.arcTo(l,t+h,l,t+h-r,r);x.lineTo(l,t+r);x.arcTo(l,t,l+r,t,r);x.closePath();x.stroke();
    x.beginPath();x.moveTo(36*s,19*s);x.lineTo(36*s,31*s);x.moveTo(64*s,19*s);x.lineTo(64*s,31*s);x.stroke();
    x.beginPath();x.moveTo(37*s,55*s);x.lineTo(46*s,64*s);x.lineTo(64*s,45*s);x.stroke();
    return c.toDataURL('image/png');
  }
  try{
    var i180=icon(180),i192=icon(192),i512=icon(512);
    var a=document.createElement('link');a.rel='apple-touch-icon';a.href=i180;document.head.appendChild(a);
    var f=document.createElement('link');f.rel='icon';f.type='image/png';f.href=i192;document.head.appendChild(f);
    var base=location.href.split('#')[0].split('?')[0];
    var scope=base.substring(0,base.lastIndexOf('/')+1);
    var man={name:'MBBS Study Planner',short_name:'MBBS Plan',start_url:base,scope:scope,display:'standalone',
      orientation:'portrait',background_color:'#0b0f17',theme_color:'#0b0f17',
      icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    var m=document.createElement('link');m.rel='manifest';
    m.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(m);
  }catch(e){}
})();
</script>
<style>
:root{--bg:#0b0f17;--card:#131a27;--card2:#1a2233;--card3:#222b3f;--line:#26304a;--tx:#e8ecf4;--mut:#8b95a8;--acc:#7c9cff;--acc2:#5b7cff;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--r:16px;--sT:env(safe-area-inset-top,0px);--sB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + var(--sB));min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sT)) 16px 10px;background:rgba(11,15,23,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
header.top .sub{font-size:12px;color:var(--mut);font-weight:500}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card)}
.iconbtn svg{width:22px;height:22px}
main{padding:12px 14px 20px;max-width:720px;margin:0 auto}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:22px 4px 10px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .cnt{background:var(--card3);color:var(--tx);border-radius:20px;padding:1px 8px;font-size:12px;letter-spacing:0}
h3{margin:0 0 14px;font-size:20px}
h4{margin:18px 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.muted{color:var(--mut)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px;background:var(--card2);border-left:4px solid var(--acc)}
.banner.warn{border-color:var(--warn)}.banner.bad{border-color:var(--bad)}.banner.ok{border-color:var(--ok)}
.banner .btn{margin-top:8px}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;background:var(--card3);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc2);color:#fff}
.btn.ok{background:rgba(74,222,128,.16);color:var(--ok)}
.btn.danger{background:rgba(248,113,113,.14);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.wide{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btnrow .btn{flex:1 1 auto}
/* blocks */
.blk{display:flex;align-items:stretch;background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden;position:relative}
.blk::before{content:"";width:5px;background:var(--c,#888);flex:none}
.chk{width:56px;flex:none;display:grid;place-items:center}
.chk span{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,#888);display:grid;place-items:center;font-size:16px;font-weight:900;color:transparent;transition:.15s}
.blk.done .chk span{background:var(--c,#888);color:#0b0f17}
.blk.done .bt{text-decoration:line-through;color:var(--mut)}
.bi{flex:1;padding:12px 4px 12px 0;min-width:0;cursor:pointer}
.bt{font-weight:600;font-size:15.5px;line-height:1.3}
.bm{font-size:13px;color:var(--mut);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtn{width:56px;flex:none;display:grid;place-items:center;font-size:18px}
.tbtn span{width:38px;height:38px;border-radius:50%;background:var(--card3);display:grid;place-items:center}
.tbtn.on span{background:var(--acc2);color:#fff}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card3);color:var(--tx);text-transform:uppercase;letter-spacing:.3px}
.tag.P{background:rgba(124,156,255,.18);color:#a9bcff}.tag.R1{background:rgba(251,191,36,.16);color:#fcd34d}.tag.R2{background:rgba(251,146,60,.18);color:#fdba74}.tag.R3{background:rgba(148,163,184,.18);color:#cbd5e1}.tag.MOCK{background:rgba(248,113,113,.18);color:#fca5a5}.tag.CUSTOM{background:rgba(74,222,128,.15);color:#86efac}
.tick{font-variant-numeric:tabular-nums;color:var(--acc)}
.moved{color:var(--warn)}
.rev{background:var(--card);border-radius:14px;margin-bottom:8px;padding:12px 14px;border-left:5px solid var(--c,#888)}
.rev .rb{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.dots{letter-spacing:2px;font-size:12px;color:var(--acc)}
.empty{text-align:center;padding:28px 16px;color:var(--mut);background:var(--card);border-radius:var(--r)}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card3);color:var(--tx)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:700}
.cell{min-height:58px;border-radius:10px;background:var(--card);padding:5px;font-size:11px;position:relative;cursor:pointer;display:flex;flex-direction:column;border:1.5px solid transparent}
.cell .cn{font-weight:700;font-size:13px}
.cell .ch{color:var(--mut);margin-top:auto}
.cell .cb{height:4px;border-radius:2px;background:var(--card3);margin-top:3px;overflow:hidden}
.cell .cb i{display:block;height:100%;background:var(--ok)}
.cell.out{opacity:.25;cursor:default}
.cell.blank{background:transparent;cursor:default}
.cell.today{border-color:var(--acc)}
.cell.buffer{background:repeating-linear-gradient(135deg,var(--card),var(--card) 6px,#171f2e 6px,#171f2e 12px)}
.cell.light{background:#152030}
.cell.final{background:#2a1d2a}
.cell.miss .cn{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:10px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* timeline */
.day{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.day.today{outline:2px solid var(--acc)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.dayh b{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--card2);border-left:3px solid var(--c,#888);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.45;text-decoration:line-through}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:36px;padding:6px 14px;border-radius:20px;background:var(--card);font-size:14px;font-weight:600;color:var(--mut);border:1.5px solid transparent}
.fchip.on{color:var(--tx);border-color:var(--c,var(--acc))}
/* topics */
.trow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:6px;border-left:4px solid var(--c,#888);cursor:pointer}
.trow .tn{font-weight:600;font-size:15px}
.trow .tm{font-size:12.5px;color:var(--mut);margin-top:3px}
.trow .tx{flex:1;min-width:0}
.star{color:var(--warn);font-size:18px}
.pill{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.pill.H{background:rgba(248,113,113,.16);color:#fca5a5}.pill.M{background:rgba(251,191,36,.14);color:#fcd34d}.pill.L{background:rgba(148,163,184,.16);color:#cbd5e1}
.ks{font-size:12px;font-weight:700;margin-right:4px}
.ks.y{color:var(--ok)}.ks.p{color:var(--warn)}.ks.n{color:#4b556b}
.subh{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px}
.subh b{font-size:16px}
.bar{height:8px;border-radius:4px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin-bottom:12px;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:6px;font:16px -apple-system,system-ui,sans-serif;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:26px;height:26px;min-height:0;display:inline-block;vertical-align:middle;margin:0 8px 0 0;accent-color:var(--acc2);-webkit-appearance:checkbox;appearance:auto}
.chkl{display:flex;align-items:center;min-height:44px;color:var(--tx);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hours7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hours7 label{font-size:11px;text-align:center;margin:0}
.hours7 input{padding:8px 2px;text-align:center}
.search{position:relative}
/* sheet */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-wrap.open{display:flex}
.sheet{background:#111827;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + var(--sB));animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:2px auto 12px}
.sheet .close{float:right}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(14,19,30,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sB))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);min-height:52px;justify-content:center;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
svg.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* timer */
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt{font-size:54px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ring .tl{color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.bigbtns{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.bigbtns .btn{min-height:56px;font-size:17px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sB));transform:translateX(-50%) translateY(20px);background:#e8ecf4;color:#0b0f17;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chart{width:100%;height:auto;display:block}
details{background:var(--card);border-radius:12px;padding:10px 14px;margin:10px 0}
details summary{font-weight:600;cursor:pointer;min-height:28px}
details li{margin:6px 0;font-size:14px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const pad=n=>String(n).padStart(2,'0');
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function dow(s){return pd(s).getDay();}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function today(){return (typeof globalThis!=='undefined'&&globalThis.__TODAY)||ds(new Date());}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);}
const r15=m=>Math.round(m/15)*15;
function finalStart(st){return addDays(st.end,-(Math.max(0,st.finalDays)-1));}

/* ================= SCHEDULER ================= */
function dayInfo(S,d){
  const st=S.settings,w=dow(d);
  if(d<st.start||d>st.end) return {type:'out',cap:0,catchup:0};
  const net=h=>Math.max(0,Math.round(h*60)-st.srMin);
  if(st.finalDays>0&&d>=finalStart(st)){const c=net(st.hours[w]);return {type:'final',cap:c,catchup:c};}
  if(w===st.bufferDay) return {type:'buffer',cap:0,catchup:Math.round(st.bufferHours*60)};
  if(w===st.lightDay){const c=net(st.lightHours);return {type:'light',cap:c,catchup:c};}
  const c=net(st.hours[w]);return {type:c>0?'normal':'rest',cap:c,catchup:c};
}
function reqMin(t,k,r){
  if(k==='P') return t.mins;
  const w=t.weak?1.5:1;
  if(k==='R1') return t.mins*r.r1*w;
  if(k==='R2') return t.mins*r.r2*w;
  if(k==='R3') return (t.pri==='H'||t.weak)?t.mins*0.12:0;
  return 0;
}
/* a block covers one or more topics: tm = [[topicId, minutes], ...] */
function btm(b){return b.tm||(b.tid?[[b.tid,b.dur]]:[]);}
function hasT(b,tid){return b.tid===tid||(b.tids&&b.tids.indexOf(tid)>=0);}
function durOf(tm){return Math.max(15,r15(tm.reduce((a,x)=>a+x[1],0)));}
function splitChunks(m,max){
  if(m<=max) return [m];
  const n=Math.ceil(m/max),base=r15(m/n),out=[];
  for(let i=0;i<n-1;i++) out.push(base);
  const last=m-base*(n-1);
  if(last>=15) out.push(last); else out[out.length-1]+=last;
  return out;
}
function splitItem(h,free){
  if(h.tm.length>1){
    let acc=0,i=0;
    while(i<h.tm.length&&r15(acc+h.tm[i][1])<=free){acc+=h.tm[i][1];i++;}
    if(i>0&&i<h.tm.length){const a=Object.assign({},h,{tm:h.tm.slice(0,i)});a.dur=durOf(a.tm);h.tm=h.tm.slice(i);h.dur=durOf(h.tm);return a;}
  }
  const first=h.tm[0];let take=Math.floor(free/15)*15;
  if(first[1]-take<30) take=Math.floor((first[1]-30)/15)*15;
  if(take<30) return null;
  const a=Object.assign({},h,{tm:[[first[0],take]],dur:take});
  h.tm=h.tm.map((x,i)=>i===0?[x[0],x[1]-take]:x);h.dur=durOf(h.tm);
  return a;
}
const BUNDLE={R1:90,R2:90,R3:60};
function buildPlan(S,from){
  const st=S.settings;
  if(!from||from<st.start) from=st.start;
  let res=null;
  for(let f=1;f>=0.3;f=Math.round((f-0.05)*100)/100){res=planCore(S,from,f);if(!res.overflow&&!res.pSpill)break;}
  if(res.overflow||res.pSpill){const r1=planCore(S,from,1);if(r1.overflow<=res.overflow&&r1.pSpill===res.pSpill)res=r1;}
  S.blocks=res.keep.concat(res.gen);
  S.meta=Object.assign({},S.meta||{},{r1:res.r.r1,r2:res.r.r2,overflow:res.overflow,pSpill:res.pSpill,builtFrom:from,builtAt:Date.now(),dirty:false,totalCap:res.totalCap});

}
function planCore(S,from,f){
  const st=S.settings;

  const done={};
  keep.forEach(b=>{if(b.done)btm(b).forEach(([tid,m])=>{const k=tid+'|'+b.kind;done[k]=(done[k]||0)+m;});});

    days.push({date:d,type:info.type,cap:Math.max(0,info.cap-used),used:0,items:[],tail:[],subjMin:{},last:null});
  }
  const totalCap=days.reduce((a,d)=>a+d.cap,0);
  const topics=S.topics.slice().sort((a,b)=>a.ord-b.ord);
  const remain=(t,k,r)=>{const m=reqMin(t,k,r)-(done[t.id+'|'+k]||0);return m>(k==='P'?7:0.5)?m:0;};
    const mocks=S.subjects.filter(s=>s.mock>0&&!doneMock.has(s.id)).map(s=>({tm:[],subj:s.id,kind:'MOCK',title:s.mockTitle||('Mock: '+s.name),dur:s.mock}));
  const mockMin=mocks.reduce((a,m)=>a+m.dur,0);
  const r={r1:st.r1*f,r2:st.r2*f};
  let overflow=0,pSpill=false;
  for(let i=days.length-1;i>=0&&mocks.length;i--){
    const d=days[i];

  }
  if(mocks.length&&days.length){const L=days[days.length-1];mocks.forEach(m=>{L.tail.push(m);L.used+=m.dur;overflow+=m.dur;});}
  let di=0;
  const mkQ=k=>{
    const q={},tot={},placed={};
    S.subjects.forEach(s=>{
      const items=[];let cur=null;
      topics.filter(t=>t.subj===s.id).forEach(t=>{
        const m=remain(t,k,r);if(!m)return;
        if(k==='P'){splitChunks(m,st.maxBlock).forEach(c=>items.push({subj:s.id,kind:k,tm:[[t.id,c]],dur:c}));return;}
        if(cur&&cur.tm.reduce((a,x)=>a+x[1],0)+m<=BUNDLE[k]){cur.tm.push([t.id,m]);}
        else{cur={subj:s.id,kind:k,tm:[[t.id,m]]};items.push(cur);}
      });
      items.forEach(it=>{if(k!=='P')it.dur=durOf(it.tm);});

  const fill=(Q,allowFinal)=>{
    const {q,tot,placed}=Q;let L;
    while((L=Object.keys(q).filter(s=>q[s].length)).length){
      if(di>=days.length) return false;

      const free=d.cap-d.used;
      if(free<15){di++;continue;}
      const maxSub=Math.max(120,Math.round(d.cap*0.4));

      let pref=L.filter(s=>s!==d.last&&(d.subjMin[s]||0)<maxSub);
      if(!pref.length) pref=L.filter(s=>s!==d.last);

      d.items.push(item);d.used+=item.dur;d.subjMin[pick]=(d.subjMin[pick]||0)+item.dur;d.last=pick;placed[pick]+=item.dur;
    }
    return true;
  };
  const dump=Q=>{const L=days[days.length-1];if(!L)return;Object.values(Q.q).forEach(a=>a.forEach(it=>{L.items.push(it);L.used+=it.dur;overflow+=it.dur;}));};
  const QP=mkQ('P');

  const gen=[];
  days.forEach(d=>{
    const base=keep.filter(b=>b.date===d.date).reduce((a,b)=>Math.max(a,b.ord||0),0);
    d.items.concat(d.tail).forEach((it,i)=>{const tm=it.tm.map(x=>[x[0],Math.round(x[1]*10)/10]);
      gen.push({id:uid(),tid:tm.length?tm[0][0]:null,tids:tm.map(x=>x[0]),tm,subj:it.subj,kind:it.kind,title:it.title||null,dur:it.dur,date:d.date,ord:base+1+i,done:false,sec:0,credit:0});});
  });
  const cnt={},tc={};
  gen.forEach(b=>{if(b.tids.length===1){const k=b.tid+'|'+b.kind;tc[k]=(tc[k]||0)+1;}});
  gen.forEach(b=>{if(b.tids.length===1){const k=b.tid+'|'+b.kind;cnt[k]=(cnt[k]||0)+1;b.part=tc[k]>1?cnt[k]+'/'+tc[k]:null;}});
  return {keep,gen,overflow,pSpill,r,totalCap};
}
function freeMap(S,from){
  const m={},st=S.settings;
  for(let d=from;d<=st.end;d=addDays(d,1)) m[d]=dayInfo(S,d).catchup;
  S.blocks.forEach(b=>{if(b.date&&m[b.date]!==undefined)m[b.date]-=b.dur;});
  return m;
}
function maxOrd(S,d){return S.blocks.reduce((a,b)=>b.date===d?Math.max(a,b.ord||0):a,0);}
function placeLoose(S,items,from){
  const fs=finalStart(S.settings),free=freeMap(S,from),dates=Object.keys(free).sort(),un=[];
  for(const b of items){
    const min=b._min||from;
    let order=dates.filter(d=>d>=min);
    if(b.kind==='P') order=order.filter(d=>d<fs).concat(order.filter(d=>d>=fs));
    const d0=order.find(d=>free[d]>=b.dur);
    if(d0){b.ord=maxOrd(S,d0)+1;b.date=d0;free[d0]-=b.dur;delete b._min;continue;}
    const parts=[],f2=Object.assign({},free);let rem=b.dur;

      x.dur=take;if(otm.length){x.tm=otm.map(([id,m])=>[id,Math.round(m*take/orig*10)/10]);x.tids=otm.map(y=>y[0]);x.tid=otm[0][0];}
      x.ord=maxOrd(S,d)+1;x.date=d;delete x._min;});

function autoReschedule(S){
  const st=S.settings,t=today();
  if(t>st.end) return {moved:0};
  const from=t<st.start?st.start:t;
  let missed=S.blocks.filter(b=>!b.done&&b.date&&b.date<from);
  if(!missed.length) return {moved:0};
  const drop=new Set(missed.filter(b=>b.kind==='R3').map(b=>b.id));
  S.blocks=S.blocks.filter(b=>!drop.has(b.id));
  missed=missed.filter(b=>!drop.has(b.id)).sort((a,b)=>a.date.localeCompare(b.date)||((a.ord||0)-(b.ord||0)));
  const n=missed.length;
  missed.forEach(b=>{b.date=null;b.moved=true;});
  let un=placeLoose(S,missed,from);
  if(un.length){
    const r3=S.blocks.filter(b=>!b.done&&b.kind==='R3'&&b.date&&b.date>=from).sort((a,b)=>b.date.localeCompare(a.date));
    for(const x of r3){if(!un.length)break;S.blocks=S.blocks.filter(y=>y.id!==x.id);un=placeLoose(S,un,from);}
  }
  if(un.length){un.forEach(b=>{if(b.kind==='CUSTOM')b.date=from;});buildPlan(S,from);return {moved:n,dropped:drop.size,rebuilt:true};}

}

function newSR(){return {studied:null,c:0,next:null,mastered:null,hist:[]};}
function srStart(t,d){t.sr={studied:d,c:0,next:addDays(d,SR_INTERVALS[0]),mastered:null,hist:(t.sr&&t.sr.hist||[]).concat({d,a:'studied'})};}
function srReview(t,d){t.sr.c++;t.sr.hist.push({d,a:'ok'});if(t.sr.c>=SR_MASTER){t.sr.mastered=d;t.sr.next=null;}else t.sr.next=addDays(d,SR_INTERVALS[Math.min(t.sr.c,SR_INTERVALS.length-1)]);}
function srForgot(t,d){t.sr.c=0;t.sr.mastered=null;t.sr.next=addDays(d,SR_INTERVALS[0]);t.sr.hist.push({d,a:'forgot'});}
function checkStudied(S,tid,d){
  const t=S.topics.find(x=>x.id===tid);if(!t||t.sr.studied)return false;
  const ps=S.blocks.filter(b=>hasT(b,tid)&&b.kind==='P');
  if(ps.length&&ps.every(b=>b.done)){srStart(t,d);return true;}
  return false;
}
function makeInitialState(){
  const S={v:1,settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),subjects:SUBJECTS.map(s=>Object.assign({},s)),topics:[],blocks:[],log:{},timer:null,pomo:null,meta:{},created:today(),lastOpen:today()};

const topicById=id=>S.topics.find(t=>t.id===id);
const blk=id=>S.blocks.find(b=>b.id===id);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtMin(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m';}
function fmtH(m){return (Math.round(m/6)/10)+'h';}
function fmtDate(s){const d=pd(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function shortDate(s){const d=pd(s);return d.getDate()+' '+MON[d.getMonth()];}
function clock(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):m)+':'+pad(s);}
const sum=(a,f)=>a.reduce((x,y)=>x+(f?f(y):y),0);
function fromDay(){const t=today();return t<S.settings.start?S.settings.start:t;}
function blockTitle(b){
  if(b.kind==='MOCK'&&!b.tid) return b.title||'Mock exam';
  if(!b.tid) return b.title||'Custom block';
  const ids=b.tids&&b.tids.length?b.tids:[b.tid];
  if(ids.length>1) return ids.map(i=>{const t=topicById(i);return t?t.name:'(deleted)';}).join(' · ');
  const t=topicById(ids[0]);return (t?t.name:'(deleted topic)')+(b.part?' ('+b.part+')':'');
}
function blocksOn(d){return S.blocks.filter(b=>b.date===d).sort((a,b)=>(a.ord||0)-(b.ord||0));}
function addLog(d,sec){S.log[d]=Math.max(0,(S.log[d]||0)+sec);}
function blockSec(b){let s=b.sec||0;if(S.timer&&S.timer.bid===b.id)s+=(Date.now()-S.timer.start)/1000;return s;}
function todaySec(){let s=S.log[today()]||0;if(S.timer)s+=(Date.now()-S.timer.start)/1000;if(S.pomo&&S.pomo.running&&S.pomo.mode==='focus')s+=(Math.min(Date.now(),S.pomo.endAt)-S.pomo.segStart)/1000;return s;}
function streak(){let d=today();if(!((S.log[d]||0)>0))d=addDays(d,-1);let n=0;while((S.log[d]||0)>0){n++;d=addDays(d,-1);}return n;}
function dueReviews(){const t=today();return S.topics.filter(x=>x.sr.next&&!x.sr.mastered&&x.sr.next<=t).sort((a,b)=>a.sr.next.localeCompare(b.sr.next));}
function kindState(tid,k){const bs=S.blocks.filter(b=>hasT(b,tid)&&b.kind===k);if(!bs.length)return null;const d=bs.filter(b=>b.done).length;return d===bs.length?'y':d?'p':'n';}
function topicStatus(t){
  if(t.sr.mastered) return 'mastered';

const STATUS_LABEL={new:'Not started',progress:'In progress',studied:'Studied (reviewing)',mastered:'Mastered'};
function dotsHTML(c){let s='';for(let i=0;i<SR_MASTER;i++)s+=i<c?'●':'○';return '<span class="dots">'+s+'</span>';}
function toast(msg,ms){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms||2600);}
function clampNum(v,min,max,def){v=parseFloat(v);if(isNaN(v))return def;return Math.min(max,Math.max(min,v));}

/* ================= TIMERS ================= */
function stopTimer(){if(!S.timer)return;const b=blk(S.timer.bid);const sec=Math.round((Date.now()-S.timer.start)/1000);if(b)b.sec=(b.sec||0)+sec;addLog(today(),sec);S.timer=null;}
function toggleTimer(id){
  if(S.timer&&S.timer.bid===id){stopTimer();}
  else{stopTimer();if(S.pomo&&S.pomo.running)pomoPause(true);S.timer={bid:id,start:Date.now()};}
  save();render();
}
let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  if(actx){try{[0,0.35,0.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
    const s=actx.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.35,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.3);o.start(s);o.stop(s+0.32);});}catch(e){}}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function pomoInit(){if(!S.pomo||typeof S.pomo!=='object')S.pomo={mode:'focus',running:false,endAt:0,left:null,count:0,countDate:today(),bid:null,segStart:0,cycle:0};
  if(S.pomo.countDate!==today()){S.pomo.count=0;S.pomo.countDate=today();}}
function pomoLen(m){const p=S.settings.pomo;return (m==='focus'?p.focus:m==='short'?p.short:p.long)*60;}
function pomoLeft(){const P=S.pomo;if(P.running)return Math.max(0,(P.endAt-Date.now())/1000);return P.left!=null?P.left:pomoLen(P.mode);}
function pomoCredit(){const P=S.pomo;if(P.mode!=='focus'||!P.running)return;const sec=Math.round((Math.min(Date.now(),P.endAt)-P.segStart)/1000);
  if(sec>0){addLog(today(),sec);const b=P.bid&&blk(P.bid);if(b)b.sec=(b.sec||0)+sec;}P.segStart=Date.now();}
function pomoStart(){unlockAudio();stopTimer();const P=S.pomo,left=pomoLeft();P.running=true;P.endAt=Date.now()+left*1000;P.segStart=Date.now();P.left=null;save();render();}
function pomoPause(silent){const P=S.pomo;if(!P.running)return;pomoCredit();P.left=pomoLeft();P.running=false;save();if(!silent)render();}
function pomoReset(){const P=S.pomo;if(P.running)pomoCredit();P.running=false;P.left=null;save();render();}
function pomoMode(m){const P=S.pomo;if(P.running)pomoCredit();P.running=false;P.mode=m;P.left=null;save();render();}
function pomoFinish(skipped){
  const P=S.pomo;if(P.running)pomoCredit();
  if(P.mode==='focus'){
    if(!skipped){if(P.countDate!==today()){P.count=0;P.countDate=today();}P.count++;}
    P.cycle=(P.cycle||0)+1;P.mode=P.cycle%S.settings.pomo.every===0?'long':'short';
  }else P.mode='focus';
  P.running=false;P.left=null;
  if(!skipped){beep();toast(P.mode==='focus'?'Break over — back to focus':'Focus session done — take a break',4000);}
  save();render();
}

/* ================= ACTIONS ON DATA ================= */
function toggleDone(id){
  const b=blk(id);if(!b)return;
  if(S.timer&&S.timer.bid===id)stopTimer();
  if(!b.done){
    b.done=true;b.doneDate=today();
    if((b.sec||0)<60){b.credit=b.dur*60;addLog(b.doneDate,b.credit);}
    if(b.kind==='P'&&btm(b).map(x=>checkStudied(S,x[0],today())).some(Boolean))toast('Topic studied ✓ First review tomorrow');
  }else{
    b.done=false;if(b.credit){addLog(b.doneDate||today(),-b.credit);b.credit=0;}b.doneDate=null;
  }
  save();render();
}
function dailyRoutine(force){
  const t=today();
  if(!force&&S.lastOpen===t)return;
  S.lastOpen=t;pomoInit();
  if(S.settings.autoResched||force){
    const r=autoReschedule(S);
    if(r.moved)toast((r.rebuilt?'Plan re-spread: ':'Moved ')+r.moved+' missed block'+(r.moved>1?'s':'')+(r.rebuilt?'':' into spare time'),4000);
    else if(force)toast('Nothing missed — all good');
  }
  save();
}
function regenerate(){
  const m=buildPlan(S,fromDay());save();render();
  toast(m.overflow>0?'Regenerated — over capacity by '+fmtH(m.overflow)+'. Add hours or trim topics.':'Plan regenerated',4000);
}

/* ================= RENDER ================= */

function dayBanner(info,t){
  const st=S.settings;
  if(info.type==='buffer')return '<div class="banner warn"><b>Buffer day.</b> No new topics today. Finish anything missed, do your reviews, then rest.</div>';
  if(info.type==='light')return '<div class="banner"><b>Light day.</b> Shorter load. Use the spare time for weak topics or rest.</div>';
  if(info.type==='final')return '<div class="banner bad"><b>Final revision window.</b> Revision and mocks only. No new material.</div>';
  if(info.type==='rest')return '<div class="banner"><b>Rest day.</b> Nothing planned.</div>';

}
function vToday(){

  h+=dayBanner(info,t);

    h+=(ui.allOver?overdue:overdue.slice(0,5)).map(b=>blockRow(b,{showDate:true})).join('');

  }
  h+=`<h2>${fmtDate(t)} <span class="cnt">${todays.filter(b=>b.done).length}/${todays.length}</span></h2>`;

  h+=`<div class="btnrow"><button class="btn ghost sm" data-a="addBlockTo" data-id="${t}">＋ Add block</button><button class="btn ghost sm" data-a="tab" data-id="timer">Start Pomodoro</button></div>`;

  h+=`<p class="muted small" style="margin:14px 4px">Studied today: <b data-tick="today">${clock(todaySec())}</b> · ${st.srMin} min/day is kept free for reviews.</p>`;

function vCal(){
  const st=S.settings;
  const minM=st.start.slice(0,7),maxM=st.end.slice(0,7);
  if(!ui.month){const t=today().slice(0,7);ui.month=t<minM?minM:t>maxM?maxM:t;}
  const [y,m]=ui.month.split('-').map(Number);
  const first=new Date(y,m-1,1),off=(first.getDay()+6)%7,dim=new Date(y,m,0).getDate(),t=today();
  let h=`<div class="calhead"><button class="iconbtn" data-a="monPrev" ${ui.month<=minM?'disabled style="opacity:.3"':''}>‹</button><b>${MON[m-1]} ${y}</b><button class="iconbtn" data-a="monNext" ${ui.month>=maxM?'disabled style="opacity:.3"':''}>›</button></div><div class="cal">`;
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>h+=`<div class="dh">${d}</div>`);
  for(let i=0;i<off;i++)h+='<div class="cell blank"></div>';
  for(let i=1;i<=dim;i++){
    const d=ds(new Date(y,m-1,i)),info=dayInfo(S,d),bl=blocksOn(d),pl=sum(bl,b=>b.dur),dn=sum(bl.filter(b=>b.done),b=>b.dur);

  }

    });
  });

}

function barChart(){
  const t=today(),W=340,H=150,pb=22,n=14,data=[];
  for(let i=n-1;i>=0;i--){const d=addDays(t,-i);data.push({d,s:(S.log[d]||0)/3600,p:sum(blocksOn(d),b=>b.dur)/60});}
  const mx=Math.max(1,...data.map(x=>Math.max(x.s,x.p))),bw=W/n;
  let g='';
  data.forEach((x,i)=>{const X=i*bw+3,w=bw-6,hp=(H-pb)*x.p/mx,hs=(H-pb)*x.s/mx;
    g+=`<rect x="${X}" y="${H-pb-hp}" width="${w}" height="${hp}" rx="3" fill="none" stroke="#8b95a8" stroke-width="1.2"/>`;
    g+=`<rect x="${X+2}" y="${H-pb-hs}" width="${w-4}" height="${hs}" rx="2" fill="#5b7cff"/>`;
    if(i%2===n%2||i===n-1)g+=`<text x="${X+w/2}" y="${H-6}" fill="#8b95a8" font-size="9" text-anchor="middle">${pd(x.d).getDate()}</text>`;});
  g+=`<text x="2" y="10" fill="#8b95a8" font-size="9">${mx.toFixed(1)}h</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function burnChart(){
  const st=S.settings,t=today(),W=340,H=170,pl=4,pb=20;
  const dates=[];for(let d=st.start;d<=st.end;d=addDays(d,1))dates.push(d);
  if(dates.length<2)return '';
  const tot=sum(S.blocks,b=>b.dur)||1;
  let cp=0,cd=0;const P=[],D=[];
  const byDate={},doneBy={};S.blocks.forEach(b=>{if(b.date)byDate[b.date]=(byDate[b.date]||0)+b.dur;if(b.done)doneBy[b.doneDate||b.date]=(doneBy[b.doneDate||b.date]||0)+b.dur;});
  const pre=sum(Object.keys(doneBy).filter(d=>d<st.start),d=>doneBy[d]);cd=pre;
  const x=i=>pl+(W-pl*2)*i/(dates.length-1),y=v=>(H-pb)-(H-pb-8)*v/tot;
  dates.forEach((d,i)=>{cp+=byDate[d]||0;P.push(x(i).toFixed(1)+','+y(cp).toFixed(1));if(d<=t){cd+=doneBy[d]||0;D.push(x(i).toFixed(1)+','+y(cd).toFixed(1));}});
  const ti=dates.indexOf(t);
  let g=`<polyline points="${P.join(' ')}" fill="none" stroke="#8b95a8" stroke-width="2" stroke-dasharray="4 3"/>`;
  if(D.length)g+=`<polyline points="${D.join(' ')}" fill="none" stroke="#4ade80" stroke-width="2.5"/>`;
  if(ti>=0)g+=`<line x1="${x(ti)}" x2="${x(ti)}" y1="6" y2="${H-pb}" stroke="#7c9cff" stroke-width="1"/><text x="${Math.min(x(ti)+3,W-30)}" y="14" fill="#7c9cff" font-size="9">today</text>`;
  g+=`<text x="${pl}" y="${H-5}" fill="#8b95a8" font-size="9">${shortDate(st.start)}</text><text x="${W-pl}" y="${H-5}" fill="#8b95a8" font-size="9" text-anchor="end">${shortDate(st.end)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

  <div class="btnrow"><button class="btn" data-a="regen">Regenerate now</button><button class="btn" data-a="reschedule">Spread missed blocks</button></div>
  <div class="card" style="background:var(--card2);margin-top:12px">
   <div class="kv"><span>Usable hours in plan</span><b>${fmtH(m.totalCap||0)}</b></div>
   <div class="kv"><span>Revision lengths in use</span><b>R1 ${Math.round((m.r1||st.r1)*100)}% · R2 ${Math.round((m.r2||st.r2)*100)}%</b></div>
   <div class="kv"><span>Over capacity</span><b style="color:${m.overflow>0?'var(--bad)':'var(--ok)'}">${m.overflow>0?fmtH(m.overflow):'No'}</b></div></div>
  <h4>Backup</h4>
  <div class="btnrow"><button class="btn" data-a="export">Export JSON</button><button class="btn" data-a="importFile">Import JSON</button><button class="btn" data-a="copyBackup">Copy backup</button></div>
  <label style="margin-top:12px">Or paste a backup here<textarea id="pasteIn" placeholder='{"v":1, ...}' style="min-height:70px"></textarea></label>
  <button class="btn wide" data-a="importPaste">Import pasted backup</button>
  <h4>Danger zone</h4>
  <button class="btn danger wide" data-a="reset">Reset everything</button>
  <details><summary>Assumptions used to build the plan</summary><ul>
   <li>Subjects: Microbiology, Parasitology and Forensic Medicine (all terms); Pathology and Pharmacology (Term 9); Surgery (all 60 lectures, Terms 5–11). Taken from the Jaffna 2024 curriculum.</li>
   <li>6 h self-study on weekdays and 8 h on Saturday and Sunday, outside ward postings and lectures. Prayers, gym and basketball fit around these hours. Change them above.</li>
   <li>Sunday is the buffer day: no new topics, up to 4 h for missed blocks. Wednesday is a light day of 3 h.</li>
   <li>30 min of each study day is kept free for spaced-repetition reviews.</li>
   <li>No exam dates were given, so every exam is assumed to be after 31 Dec. 27–31 Dec are revision and mock days only.</li>
   <li>25 Dec is planned as a normal study day. Edit that day if you need it off.</li>
   <li>Topic hours are estimates weighted by yield (High, Med, Low) and difficulty. Edit any topic to change them.</li>
  </ul></details>
  <p class="muted small" style="text-align:center">Data is stored only on this device. Export a backup weekly.</p>`);
}

/* ================= ACTION HANDLERS ================= */
const A={
  allOver:()=>{ui.allOver=!ui.allOver;render();},
  tab:id=>{ui.tab=id;render._scrolled=false;render();window.scrollTo(0,0);},
  gear:()=>sheetSettings(),
  closeSheet:()=>closeSheet(),
  toggle:id=>{toggleDone(id);if($('#sheetWrap').classList.contains('open')){const b=blk(id);if(b&&b.date&&$('#sheet').innerHTML.includes('data-a="blkUp"'))sheetDay(b.date);}},
  timer:id=>toggleTimer(id),
  editBlock:id=>sheetBlock(id),
  openDay:d=>sheetDay(d),
  openTopic:id=>sheetTopic(id),
  addBlockTo:d=>sheetBlock(null,d),
  saveBlock:id=>{
    const tid=$('#bTopic').value||null,kind=$('#bKind').value,dur=+$('#bDur').value,date=$('#bDate').value||fromDay(),title=$('#bTitle').value.trim();
    let b=id?blk(id):null;
    if(!b){b={id:uid(),done:false,sec:0,credit:0,ord:0,date:null};S.blocks.push(b);}
    if(date!==b.date){b.ord=maxOrd(S,date)+1;b.date=date;}
    if(tid==='__multi'){const k=dur/b.dur;b.tm=b.tm.map(([i,m])=>[i,Math.round(m*k*10)/10]);b.kind=kind;b.dur=dur;}
    else{const t=tid?topicById(tid):null;
      b.tid=tid;b.tids=tid?[tid]:[];b.tm=tid?[[tid,dur]]:[];b.kind=kind;b.dur=dur;b.title=t?null:(title||(kind==='MOCK'?'Mock exam':'Custom block'));
      b.subj=t?t.subj:(b.subj||null);if(!t)b.part=null;}
    save();closeSheet();render();toast('Saved');
  },
  delBlock:id=>{if(!confirm('Delete this block?'))return;if(S.timer&&S.timer.bid===id)stopTimer();S.blocks=S.blocks.filter(b=>b.id!==id);save();closeSheet();render();},
  tomorrowBlock:id=>{const b=blk(id);if(!b)return;const n=addDays(b.date&&b.date>=today()?b.date:today(),1);if(n>S.settings.end)return toast('That is past the deadline');b.ord=maxOrd(S,n)+1;b.date=n;b.moved=true;save();closeSheet();render();toast('Moved to '+fmtDate(n));},
  blkUp:id=>moveBlk(id,-1),blkDown:id=>moveBlk(id,1),
  planMode:id=>{ui.plan=id;render._scrolled=false;render();},
  monPrev:()=>{const [y,m]=ui.month.split('-').map(Number);const d=new Date(y,m-2,1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();},
  monNext:()=>{const [y,m]=ui.month.split('-').map(Number);const d=new Date(y,m,1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();},
  reschedule:()=>{dailyRoutine(true);closeSheet();render();},
  allToday:()=>{const t=today();S.blocks.filter(b=>!b.done&&b.date&&b.date<t).forEach(b=>{b.ord=maxOrd(S,t)+1;b.date=t;b.moved=true;});save();render();toast('Moved to today');},
  regen:()=>{if(!confirm('Regenerate the plan from today? Finished blocks, notes and reviews are kept. Unfinished blocks are re-spread, so manual moves are reset.'))return;closeSheet();regenerate();},
  srOk:id=>{const t=topicById(id);if(!t||!t.sr.studied)return;srReview(t,today());addLog(today(),300);save();toast(t.sr.mastered?'Mastered! 🎉':'Next review '+fmtDate(t.sr.next));afterTopicChange(id);},
  srForgot:id=>{const t=topicById(id);if(!t||!t.sr.studied)return;srForgot(t,today());addLog(today(),300);save();toast('Reset. Back tomorrow');afterTopicChange(id);},
  srStudied:id=>{const t=topicById(id);if(!t)return;srStart(t,today());save();toast('First review tomorrow');afterTopicChange(id);},
  srReset:id=>{const t=topicById(id);if(!t||!confirm('Reset spaced-repetition progress for this topic?'))return;t.sr=newSR();save();afterTopicChange(id);},
  toggleWeak:id=>{const t=topicById(id);if(!t)return;t.weak=!t.weak;S.meta.dirty=true;save();toast(t.weak?'Marked weak ★':'Weak mark removed');afterTopicChange(id);},
  saveTopic:id=>{
    const t=topicById(id);if(!t)return;
    const name=$('#tName').value.trim()||t.name,sid=$('#tSubj').value,mins=Math.max(15,r15(clampNum($('#tHrs').value,0.25,20,t.mins/60)*60)),pri=$('#tPri').value,weak=$('#tWeak').checked;
    const changed=sid!==t.subj||mins!==t.mins||pri!==t.pri||weak!==t.weak;
    if(sid!==t.subj){S.blocks.forEach(b=>{if(b.tid===id&&(!b.tids||b.tids.length<=1))b.subj=sid;});t.ord=Math.max(-1,...S.topics.filter(x=>x.subj===sid).map(x=>x.ord))+0.5;renumberTopics();}
    Object.assign(t,{name,subj:sid,mins,pri,weak});t.notes=$('#tNotes').value;
    if(changed)S.meta.dirty=true;
    save();closeSheet();render();toast(changed?'Saved. Regenerate the plan to apply the changes':'Saved',3500);
  },
  topicUp:id=>moveTopic(id,-1),topicDown:id=>moveTopic(id,1),
  delTopic:id=>{const t=topicById(id);if(!t||!confirm('Delete "'+t.name+'" and all its blocks?'))return;if(S.timer&&blk(S.timer.bid)&&hasT(blk(S.timer.bid),id))stopTimer();
    S.topics=S.topics.filter(x=>x.id!==id);
    S.blocks=S.blocks.filter(b=>{if(!hasT(b,id))return true;if(!b.tids||b.tids.length<=1)return false;
      const m=(b.tm.find(x=>x[0]===id)||[0,0])[1];b.tm=b.tm.filter(x=>x[0]!==id);b.tids=b.tm.map(x=>x[0]);b.tid=b.tids[0];if(!b.done)b.dur=durOf(b.tm);return true;});
    save();closeSheet();render();toast('Topic deleted');},
  addTopic:()=>sheetAddTopic(),
  createTopic:()=>createTopic(),
  fsubj:id=>{ui.fsubj=id;render();},
  saveSettings:()=>saveSettings(),
  export:()=>exportData(),
  copyBackup:()=>{const j=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(()=>toast('Backup copied — paste it into Notes'),()=>{$('#pasteIn').value=j;toast('Copy the text in the box');});else{$('#pasteIn').value=j;toast('Copy the text in the box');}},
  importFile:()=>$('#fileIn').click(),
  importPaste:()=>importJSON($('#pasteIn').value),
  reset:()=>{if(!confirm('Erase ALL progress, notes and changes and start a fresh plan?'))return;if(!confirm('Really reset? Export a backup first if unsure.'))return;localStorage.removeItem(KEY);S=makeInitialState();pomoInit();save();closeSheet();render();toast('Fresh plan created');},
  pStart:()=>pomoStart(),pPause:()=>pomoPause(),pReset:()=>pomoReset(),pSkip:()=>pomoFinish(true),pMode:id=>pomoMode(id)
};
function afterTopicChange(id){if(ui.sheetTopic===id&&$('#sheetWrap').classList.contains('open'))sheetTopic(id);render();}
function moveBlk(id,dir){const b=blk(id);if(!b)return;normOrd(b.date);const bl=blocksOn(b.date),i=bl.indexOf(b),j=i+dir;if(j<0||j>=bl.length)return;const o=bl[j].ord;bl[j].ord=b.ord;b.ord=o;save();sheetDay(b.date);render();}
function moveTopic(id,dir){const t=topicById(id);if(!t)return;renumberTopics();const ts=S.topics.filter(x=>x.subj===t.subj).sort((a,b)=>a.ord-b.ord),i=ts.indexOf(t),j=i+dir;if(j<0||j>=ts.length)return;
  const o=ts[j].ord;ts[j].ord=t.ord;t.ord=o;S.meta.dirty=true;save();toast(dir<0?'Moved up':'Moved down');afterTopicChange(id);}
function createTopic(){
  const name=$('#nName').value.trim();if(!name)return toast('Enter a topic name');
  const sid=$('#nSubj').value,mins=Math.max(15,r15(clampNum($('#nHrs').value,0.25,20,1)*60)),pri=$('#nPri').value,weak=$('#nWeak').checked,notes=$('#nNotes').value;
  const same=S.topics.filter(t=>t.subj===sid);
  const t={id:uid(),subj:sid,name,mins,pri,weak,notes,ord:(same.length?Math.max(...same.map(x=>x.ord)):S.topics.length)+0.5,sr:newSR()};
  S.topics.push(t);renumberTopics();
  const r={r1:S.meta.r1||S.settings.r1,r2:S.meta.r2||S.settings.r2},from=fromDay();
  const mk=(k,dur)=>{dur=Math.max(15,r15(dur));const b={id:uid(),tid:t.id,tids:[t.id],tm:[[t.id,dur]],subj:sid,kind:k,dur,date:null,ord:0,done:false,sec:0,credit:0};S.blocks.push(b);return b;};
  const ps=splitChunks(mins,S.settings.maxBlock).map(m=>mk('P',m));
  if(ps.length>1)ps.forEach((b,i)=>b.part=(i+1)+'/'+ps.length);
  let un=placeLoose(S,ps,from);
  const lastP=ps.map(b=>b.date).filter(Boolean).sort().pop()||from;
  const b1=mk('R1',reqMin(t,'R1',r));b1._min=addDays(lastP,2);un=un.concat(placeLoose(S,[b1],from));
  const b2=mk('R2',reqMin(t,'R2',r));b2._min=addDays(b1.date||lastP,3);un=un.concat(placeLoose(S,[b2],from));
  un.forEach(b=>{delete b._min;b.ord=maxOrd(S,S.settings.end)+1;b.date=S.settings.end;});
  save();closeSheet();ui.fsubj=sid;render();
  toast(un.length?'Added. No spare time left, so some blocks went on the last day':'Added and scheduled in spare time',3500);
}
function saveSettings(){
  const st=S.settings,g=id=>document.getElementById(id);
  const start=g('sStart').value||st.start,end=g('sEnd').value||st.end;
  if(end<start)return toast('Deadline must be after the start date');
  st.start=start;st.end=end;
  st.hours=[0,1,2,3,4,5,6].map(i=>clampNum(g('sH'+i).value,0,16,st.hours[i]));
  st.bufferDay=+g('sBuf').value;st.bufferHours=clampNum(g('sBufH').value,0,16,4);
  st.lightDay=+g('sLight').value;st.lightHours=clampNum(g('sLightH').value,0,16,3);
  st.srMin=Math.round(clampNum(g('sSr').value,0,180,30));st.finalDays=Math.round(clampNum(g('sFinal').value,0,14,5));
  st.maxBlock=+g('sMax').value;st.r1=clampNum(g('sR1').value,5,80,30)/100;st.r2=clampNum(g('sR2').value,5,80,15)/100;
  st.autoResched=g('sAuto').checked;ui.month=null;
  closeSheet();regenerate();
}
async function exportData(){
  const json=JSON.stringify(S,null,1),name='study-planner-backup-'+today()+'.json';
  try{if(window.File&&navigator.canShare){const file=new File([json],name,{type:'application/json'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('Backup shared');return;}}}
  catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('Backup downloaded');
}
function importJSON(text){
  try{const s=JSON.parse(text);if(!s||s.v!==1||!Array.isArray(s.topics)||!Array.isArray(s.blocks))throw new Error('bad');
    if(!confirm('Replace everything on this device with this backup?'))return;
    S=migrate(s);S.timer=null;pomoInit();S.pomo.running=false;save();closeSheet();render();toast('Backup restored');}
  catch(e){toast('That is not a valid planner backup');}
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.id,el,e);}
});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet();});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='tq'){ui.q=e.target.value;renderTopicList();}
  else if(id==='tNotes'&&ui.sheetTopic){const t=topicById(ui.sheetTopic);if(t){t.notes=e.target.value;clearTimeout(A._nt);A._nt=setTimeout(save,400);}}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='tstat'){ui.fstat=e.target.value;renderTopicList();}
  else if(id==='pBlock'){S.pomo.bid=e.target.value||null;save();}
  else if(['pF','pS','pL','pE'].includes(id)){const p=S.settings.pomo;
    p.focus=Math.round(clampNum($('#pF').value,5,90,25));p.short=Math.round(clampNum($('#pS').value,1,30,5));p.long=Math.round(clampNum($('#pL').value,5,60,15));p.every=Math.round(clampNum($('#pE').value,2,8,4));
    if(!S.pomo.running)S.pomo.left=null;save();render();}
});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(f);e.target.value='';});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.lastOpen!==today()){dailyRoutine(false);render();}else if(ui.tab==='timer'||S.timer)render();}else save();});
setInterval(()=>{
  if(S.pomo&&S.pomo.running&&Date.now()>=S.pomo.endAt){pomoFinish(false);return;}
  if(S.timer)document.querySelectorAll('[data-tick]').forEach(el=>{const id=el.dataset.tick;if(id==='today')el.textContent=clock(todaySec());else{const b=blk(id);if(b)el.textContent='⏱ '+clock(blockSec(b));}});
  if(ui.tab==='timer'&&S.pomo){const left=pomoLeft(),len=pomoLen(S.pomo.mode),C=2*Math.PI*45,pt=$('#pTime'),arc=$('#pArc');
    if(pt)pt.textContent=clock(left);if(arc)arc.setAttribute('stroke-dashoffset',C*(1-(len?left/len:0)));
    const tk=document.querySelector('[data-tick="today"]');}
  if(S.lastOpen&&S.lastOpen!==today()&&document.visibilityState==='visible'){dailyRoutine(false);render();}
},1000);

/* ================= BOOT ================= */
S=load();
if(!S){S=makeInitialState();save();}
pomoInit();
dailyRoutine(false);
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
